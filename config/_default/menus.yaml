# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the filename of the
  #     desired widget in your `content/home/` folder.
  #   The weight parameter defines the order that the links will appear in.

main:
  - name: Bio
    url: /
    weight: 10
  - name: Experience
    url: experience/
    weight: 11
  - name: Presentations
    url: /#presentations
    weight: 12
  - name: Blog
    url: /#blog
    weight: 13
  - name: Leadership
    url: leadership/
    weight: 20
  - name: Environment
    url: environment/
    weight: 30

