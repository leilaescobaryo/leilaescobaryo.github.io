bio: |
  I am a Peruvian biologist (BSc, Cayetano Heredia Peruvian University) working full time
  in primate research and conservation in the Neotropics. I currently lead, as consultant
  biologist, the ecological assessment of an Amazonian site for the reintroduction of
  primates confiscated from the illegal wildlife trade. My undergraduate thesis examines
  seed dispersal by the endemic *Lagothrix flavicauda* and *Aotus miconax* in the montane
  forests of Amazonas. I have also worked with *Ateles chamek* in Manu and Madre de Dios,
  and with reintroduced golden lion tamarins in Brazil.

