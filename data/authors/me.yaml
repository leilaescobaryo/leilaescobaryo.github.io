bio: |
  I am a biology graduate from Universidad Peruana Cayetano Heredia with a strong
  interest in primate ecology and conservation in tropical ecosystems. For my
  undergraduate thesis I studied seed dispersal by native primate species in Peru.
  I have gained field and research experience in the Peruvian Amazon and abroad,
  and I am interested in understanding species interactions and how they shape
  forest dynamics in a changing world.

