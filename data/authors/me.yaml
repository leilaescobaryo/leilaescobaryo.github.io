experience:
  - role: Consultant Biologist and Project Lead
    org: Ikama Peru Wildlife Rescue Center, Loreto, Peru
    start: 2026-06-01
    summary: |
      - Design and lead the ecological assessment determining the suitability of an Amazonian site for the reintroduction of primates confiscated from the illegal wildlife trade.
      - Estimate primate abundance and density through standardized transect surveys; establish botanical plots to characterise vegetation, forest structure and food resources.
      - Translate field results into technical recommendations for the project and for local Peruvian authorities.
      - Support socio-ecological components: surveys of local residents and environmental education.

  - role: Volunteer — Golden Lion Tamarin Monitoring Programme
    org: Associação Mico-Leão-Dourado (AMLD), Rio de Janeiro, Brazil
    start: 2026-01-01
    end: 2026-02-28
    summary: |
      - Long-term monitoring of reintroduced golden lion tamarins (*Leontopithecus rosalia*) through radio-telemetry, direct observation and tracking of individually identified animals.
      - Supported agroforestry management, ecotourism and environmental education within a Portuguese- and English-speaking team.

  - role: Undergraduate Thesis Researcher and Former Volunteer
    org: Neotropical Primate Conservation & Lab of Socio-ecological Systems, UPCH — Amazonas, Peru
    start: 2025-01-01
    summary: |
      - Designed and implemented a field study of seed dispersal by *Lagothrix flavicauda* and *Aotus miconax*, two Peruvian endemic species, in montane forest — using diurnal and nocturnal tracking, focal observations and feeding records.
      - Supported environmental education with Awajún Indigenous communities and urban schools, and contributed to the assessment of wildlife trafficking in Amazonian regions.

  - role: Fellow — Primate Research Course
    org: Cocha Cashu Biological Station, Manu National Park — San Diego Zoo Wildlife Alliance Peru
    start: 2024-10-01
    end: 2024-11-30
    summary: |
      - Intensive residential training in Neotropical primate ecology, behaviour, conservation, field methods and research design, including round tables with Indigenous communities involved in primate conservation.
      - Conducted an independent pilot study comparing activity budgets and dietary preferences of lactating and non-lactating adult female *Ateles chamek*, developing and applying an ethogram.

  - role: Field Assistant — Ateles chamek Population Monitoring
    org: Amarakaeri Communal Reserve & SERNANP, Madre de Dios, Peru
    start: 2024-07-01
    end: 2024-08-31
    summary: |
      Estimated relative abundance and population density of *Ateles chamek* in human-disturbed areas.

  - role: Volunteer — Department of Mammalogy
    org: Natural History Museum, National University of San Marcos (UNMSM), Lima, Peru
    start: 2024-04-01
    end: 2025-12-31
    summary: |
      - Supported curation of the museum's scientific mammal collections.
      - Contributed to the primate section of the updated list of the mammals of Peru, led by Dr. Víctor Pacheco.
      - Coordinated primate talks and activities for public outreach, including science fairs and Scientific Collections Day.

  - role: Research Intern — REPU Ecology Cohort
    org: Vilgalys Lab, Duke University, North Carolina, USA
    start: 2024-01-15
    end: 2024-03-27
    summary: |
      Competitive research internship in a US ecology laboratory. Conducted research in fungal genomics under the supervision of Dr. Lotus Lofgren.

